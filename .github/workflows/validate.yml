name: Validate (mocked Codex only)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . build twine
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q codex_queue
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/security-check.py
      - run: codex-queue --help
      - run: codex-queue worker --help
      - run: codex-queue add --help
      - run: codex-queue continue-session --help
      - run: codex-queue scheduled-check --help
